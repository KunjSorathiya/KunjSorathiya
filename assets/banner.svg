<circle cx="935" cy="84" r="0.8" class="s c"/>
<circle cx="220" cy="279" r="1" class="s a"/>
<circle cx="746" cy="13" r="0.8" class="s b"/>
<circle cx="1193" cy="12" r="0.6" class="s c"/>
<circle cx="258" cy="72" r="0.8" class="s a"/>
<circle cx="798" cy="119" r="1.6" class="s b"/>
<circle cx="293" cy="301" r="1" class="s c"/>
<circle cx="704" cy="123" r="1" class="s a"/>
