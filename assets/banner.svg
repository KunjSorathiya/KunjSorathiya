<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Kunj Sorathiya. Rocketry, physics, engineering. A rocket climbs over the Earth's limb.">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#02030a"/><stop offset=".6" stop-color="#07102a"/><stop offset="1" stop-color="#0d2552"/></linearGradient>
  <radialGradient id="limb" cx=".5" cy="0" r=".75"><stop offset="0" stop-color="#bfe3ff" stop-opacity=".9"/><stop offset=".08" stop-color="#5e9bff" stop-opacity=".65"/><stop offset=".3" stop-color="#1a3a7a" stop-opacity=".35"/><stop offset="1" stop-color="#02030a" stop-opacity="0"/></radialGradient>
  <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a2f" stop-opacity="0"/><stop offset=".5" stop-color="#ffb35c"/><stop offset="1" stop-color="#fff3d6"/></linearGradient>
  <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#bfe3ff" stop-opacity="0"/><stop offset="1" stop-color="#bfe3ff" stop-opacity=".85"/></linearGradient>
  <clipPath id="reveal"><rect x="0" y="0" width="0" height="380"><animate attributeName="width" from="0" to="1200" dur="2.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect></clipPath>
  <path id="ascent" d="M170 330 C 330 300, 470 250, 610 150 S 930 -10, 1110 -40"/>
</defs>
<style>
  .s{fill:#eef1f6;animation:tw 4s ease-in-out infinite}.a{animation-duration:3.1s}.b{animation-duration:4.6s;animation-delay:-1.7s}.c{animation-duration:5.8s;animation-delay:-3.4s}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .name{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:.06em}
  .sub{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:500;letter-spacing:.16em}
  .flick{animation:fl .12s steps(2,end) infinite}
  @keyframes fl{50%{transform:scaleX(.7)}}
  .glow{animation:gl 5s ease-in-out infinite}
  @keyframes gl{50%{opacity:.7}}
  @media (prefers-reduced-motion: reduce){.s,.flick,.glow{animation:none}}
</style>
<rect width="1200" height="380" fill="url(#sky)"/>
<circle cx="389" cy="47" r="0.6" class="s a"/>
<circle cx="149" cy="70" r="1.6" class="s b"/>
<circle cx="217" cy="181" r="0.8" class="s c"/>
<circle cx="216" cy="243" r="0.6" class="s a"/>
