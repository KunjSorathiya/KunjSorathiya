<circle cx="349" cy="161" r="1.2" class="s b"/>
<ellipse cx="600" cy="900" rx="1050" ry="640" fill="#050b1c"/>
<ellipse cx="600" cy="900" rx="1050" ry="640" fill="none" stroke="url(#limb)" stroke-width="3" class="glow"/>
<ellipse cx="600" cy="360" rx="760" ry="70" fill="url(#limb)" class="glow" opacity=".7"/>
<!-- the climb -->
<path d="M170 330 C 330 300, 470 250, 610 150 S 930 -10, 1110 -40" fill="none" stroke="url(#trail)" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
  <animate attributeName="stroke-dashoffset" values="1;0;0;0" keyTimes="0;.62;.9;1" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.62;.82;1" dur="9s" repeatCount="indefinite"/>
</path>
<g>
  <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.62;1" calcMode="linear"><mpath href="#ascent"/></animateMotion>
  <g class="flick" style="transform-origin:-8px 0"><path d="M-8 0 L-44 -5 L-62 0 L-44 5 Z" fill="url(#flame)"/></g>
  <path d="M-10 -6 L-10 6 L12 6 L26 0 L12 -6 Z" fill="#eef1f6"/>
  <path d="M-10 -6 L-18 -12 L-6 -6 Z M-10 6 L-18 12 L-6 6 Z" fill="#5e9bff"/>
  <rect x="2" y="-6" width="3" height="12" fill="#0d2552"/>
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.6;.64;1" dur="9s" repeatCount="indefinite"/>
</g>
<!-- the name -->
<g clip-path="url(#reveal)">
  <text x="600" y="168" text-anchor="middle" class="name" font-size="76" fill="#eef1f6">KUNJ SORATHIYA</text>
</g>
<g class="sub" font-size="19" text-anchor="middle" fill="#bfe3ff">
  <text x="600" y="214" opacity="0">ROCKETRY  ·  PHYSICS  ·  ENGINEERING<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.3;.34;1" dur="9s" begin="1.8s" repeatCount="indefinite"/></text>
  <text x="600" y="214" opacity="0">FOUNDER, INDIAN ROCKETRY ASSOCIATION<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.3;.34;1" dur="9s" begin="4.8s" repeatCount="indefinite"/></text>
  <text x="600" y="214" opacity="0">I BUILD THINGS TO UNDERSTAND HOW THEY WORK<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.3;.34;1" dur="9s" begin="7.8s" repeatCount="indefinite"/></text>
</g>
</svg>
