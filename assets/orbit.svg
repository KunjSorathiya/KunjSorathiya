<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Rocketry, physics, astrophysics, engineering and scientific computing orbit around the things I build.">
<defs>
  <radialGradient id="planet" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#bfe3ff"/><stop offset=".45" stop-color="#5e9bff"/><stop offset="1" stop-color="#0a1a3a"/></radialGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#5e9bff" stop-opacity=".45"/><stop offset="1" stop-color="#5e9bff" stop-opacity="0"/></radialGradient>
</defs>
<style>.t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif} .lab{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:.14em} .pulse{animation:p 4s ease-in-out infinite;transform-origin:450px 220px} @keyframes p{50%{transform:scale(1.12);opacity:.7}} @media (prefers-reduced-motion: reduce){.pulse{animation:none}}</style>
<circle cx="450" cy="220" r="120" fill="url(#halo)" class="pulse"/>
<g transform="translate(450 220)">
  <circle r="215" fill="none" stroke="#eef1f6" stroke-opacity=".08" stroke-dasharray="2 8"/>
  <circle r="150" fill="none" stroke="#5e9bff" stroke-opacity=".35"/>
  <circle r="95" fill="none" stroke="#eef1f6" stroke-opacity=".1" stroke-dasharray="3 7"/>
  <g transform="rotate(0.0 0 0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/><circle cx="95" cy="0" r="4" fill="#bfe3ff"/></g></g><g transform="rotate(180.0 0 0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/><circle cx="95" cy="0" r="4" fill="#bfe3ff"/></g></g><g transform="rotate(0.0 0 0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="70s" repeatCount="indefinite"/><circle cx="215" cy="0" r="4" fill="#6f5cff"/></g></g><g transform="rotate(120.0 0 0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="70s" repeatCount="indefinite"/><circle cx="215" cy="0" r="4" fill="#6f5cff"/></g></g><g transform="rotate(240.0 0 0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="70s" repeatCount="indefinite"/><circle cx="215" cy="0" r="4" fill="#6f5cff"/></g></g>
  <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/><g transform="translate(0.0 -150.0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite"/><rect x="-53.8" y="-15" width="107.6" height="30" rx="15" fill="#08122b" stroke="#5e9bff" stroke-opacity=".7"/><text x="0" y="5" text-anchor="middle" fill="#eef1f6" font-size="14" font-weight="600" class="t">Rocketry</text></g></g><g transform="translate(142.7 -46.4)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite"/><rect x="-49.2" y="-15" width="98.4" height="30" rx="15" fill="#08122b" stroke="#5e9bff" stroke-opacity=".7"/><text x="0" y="5" text-anchor="middle" fill="#eef1f6" font-size="14" font-weight="600" class="t">Physics</text></g></g><g transform="translate(88.2 121.4)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite"/><rect x="-72.2" y="-15" width="144.4" height="30" rx="15" fill="#08122b" stroke="#5e9bff" stroke-opacity=".7"/><text x="0" y="5" text-anchor="middle" fill="#eef1f6" font-size="14" font-weight="600" class="t">Astrophysics</text></g></g><g transform="translate(-88.2 121.4)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite"/><rect x="-67.6" y="-15" width="135.2" height="30" rx="15" fill="#08122b" stroke="#5e9bff" stroke-opacity=".7"/><text x="0" y="5" text-anchor="middle" fill="#eef1f6" font-size="14" font-weight="600" class="t">Engineering</text></g></g><g transform="translate(-142.7 -46.4)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite"/><rect x="-109.0" y="-15" width="218.0" height="30" rx="15" fill="#08122b" stroke="#5e9bff" stroke-opacity=".7"/><text x="0" y="5" text-anchor="middle" fill="#eef1f6" font-size="14" font-weight="600" class="t">Scientific computing</text></g></g></g>
  <circle r="52" fill="url(#planet)"/>
  <text y="6" text-anchor="middle" class="lab" font-size="15" fill="#02030a">BUILD</text>
</g>
</svg>
